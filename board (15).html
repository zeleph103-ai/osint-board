<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board</title>
<style>
  :root{
    --bg:#08080a;
    --panel:rgba(17,17,19,.72);
    --panel-2:rgba(255,255,255,.04);
    --border:#242429;
    --border-soft:#1c1c20;
    --accent:#d64545;
    --accent-glow:rgba(214,69,69,.35);
    --text:#eeeef0;
    --text-dim:#8b8b93;
    --text-faint:#55555c;
    --node-bg:#141416;
    --node-bg-2:#18181b;
    --node-border:#28282e;
    --node-border-hover:#3c3c44;
    --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;color:var(--text);
    font-family:var(--sans);
    overflow:hidden;user-select:none;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(214,69,69,.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(90,90,120,.05), transparent 60%),
      var(--bg);
  }

  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:11px 16px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);position:relative;z-index:30;
  }
  .icon-btn{
    width:32px;height:32px;border-radius:6px;background:var(--panel-2);
    border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:border-color .16s var(--ease), color .16s var(--ease), transform .16s var(--ease);
  }
  .icon-btn:hover{border-color:var(--node-border-hover);color:var(--text);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg{width:15px;height:15px;}
  .title{font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--text-faint);margin-right:2px;}
  .btn{
    border:none;border-radius:6px;padding:7px 14px;font-weight:600;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;gap:6px;letter-spacing:.01em;transition:filter .16s var(--ease), transform .16s var(--ease);
  }
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 12px var(--accent-glow);}
  .btn-accent:hover{filter:brightness(1.12);}
  .btn-accent:active{transform:scale(.96);}
  .spacer{flex:1;}
  .search{
    background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
    padding:7px 12px;color:var(--text-dim);font-size:12.5px;width:170px;
    transition:border-color .16s var(--ease);
  }
  .search:focus{outline:none;border-color:var(--node-border-hover);}

  .layout{display:flex;height:calc(100% - 0px);}
  .sidebar{
    width:220px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-right:1px solid var(--border);
    padding:16px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:20;
  }
  .newboard-btn{
    background:var(--accent);color:#fff;border:none;border-radius:6px;
    padding:9px;font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    letter-spacing:.01em;transition:filter .16s var(--ease), transform .16s var(--ease);
    box-shadow:0 2px 12px var(--accent-glow);
  }
  .newboard-btn:hover{filter:brightness(1.12);}
  .newboard-btn:active{transform:scale(.97);}
  .empty-hint{color:var(--text-faint);font-size:11.5px;text-align:center;line-height:1.6;margin-top:6px;}
  .board-item{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    padding:9px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;text-align:left;
    display:flex;align-items:center;gap:8px;transition:border-color .16s var(--ease),color .16s var(--ease),transform .16s var(--ease);
  }
  .board-item:hover{border-color:var(--node-border-hover);color:var(--text);transform:translateX(2px);}
  .board-item .b-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}

  .canvas-wrap{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(circle,#1a1a1e 1px, transparent 1px) 0 0/24px 24px, var(--bg);
  }

  .toolbar{
    position:absolute;top:16px;left:16px;z-index:10;display:flex;gap:8px;align-items:center;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:9px;padding:5px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .toolbar .btn-dark{
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    padding:7px 12px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;gap:7px;letter-spacing:.01em;
    transition:background .16s var(--ease),color .16s var(--ease),transform .1s var(--ease);
  }
  .toolbar .btn-dark:hover{background:var(--panel-2);color:var(--text);}
  .toolbar .btn-dark:active{transform:scale(.94);}
  .toolbar .btn-dark svg{width:13px;height:13px;flex-shrink:0;}
  .toolbar .divider{width:1px;height:20px;background:var(--border);margin:0 2px;}

  .zoom-controls{
    position:absolute;bottom:16px;left:16px;z-index:10;display:flex;flex-direction:column;gap:1px;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:8px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .zoom-controls button{
    width:34px;height:32px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease);
  }
  .zoom-controls button svg{width:14px;height:14px;}
  .zoom-controls button:not(:last-child){border-bottom:1px solid var(--border);}
  .zoom-controls button:hover{background:var(--panel-2);color:var(--text);}
  .zoom-controls button:active{background:rgba(255,255,255,.06);}

  .minimap{
    position:absolute;bottom:16px;right:16px;width:190px;height:140px;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:8px;
    overflow:hidden;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .minimap-dot{position:absolute;border-radius:1px;background:var(--text-faint);transition:background .2s;}

  #stage{
    position:absolute;top:0;left:0;width:6000px;height:4000px;
    transform-origin:0 0;
  }
  svg#lines{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .conn-path{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.75;stroke-linecap:round;
    filter:drop-shadow(0 0 3px var(--accent-glow));
    pointer-events:stroke;cursor:pointer;transition:stroke .12s var(--ease), stroke-width .12s var(--ease), opacity .12s var(--ease);}
  .conn-path:hover{opacity:1;stroke-width:2.2;}
  .conn-path.selected{stroke:#ffffff;opacity:1;stroke-width:2.6;filter:drop-shadow(0 0 6px var(--accent-glow));}
  .conn-dot{fill:var(--accent);}
  .conn-hit{fill:none;stroke:transparent;stroke-width:16px;pointer-events:stroke;cursor:pointer;}
  .conn-temp{stroke-dasharray:6 5;opacity:.85;pointer-events:none;}

  .node{
    position:absolute;min-width:190px;min-height:70px;
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(165deg, var(--node-bg-2), var(--node-bg));
    border:1px solid var(--node-border);
    border-radius:9px;padding:0;cursor:grab;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
    will-change:transform;
  }
  .node:hover{border-color:var(--node-border-hover);}
  .node:active{cursor:grabbing;}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 6px 20px rgba(0,0,0,.35), 0 0 20px var(--accent-glow);}
  .node.dragging{
    cursor:grabbing;transform:scale(1.02);
    box-shadow:0 20px 44px rgba(0,0,0,.5), 0 0 0 1px var(--node-border-hover);
    z-index:100;transition:none;
  }
  .node.entering{animation:nodeIn .28s var(--ease);}
  @keyframes nodeIn{
    from{opacity:0;transform:scale(.92) translateY(4px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }

  .node-head{
    display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-faint);
    font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    padding:8px 10px 6px;border-bottom:1px solid var(--border-soft);
  }
  .node-head svg{width:12px;height:12px;flex-shrink:0;color:var(--text-dim);transition:color .18s var(--ease);}
  .node:hover .node-head svg{color:var(--accent);}
  .node-head .n-label{flex:1;background:transparent;border:none;color:var(--text-dim);font-size:10.5px;
    font-weight:600;letter-spacing:.05em;text-transform:uppercase;outline:none;font-family:inherit;
    cursor:default;user-select:none;-webkit-user-select:none;pointer-events:none;border-radius:3px;}

  .node-body{font-size:12.5px;color:var(--text);padding:8px 10px 10px;flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;}
  .node-body input, .node-body textarea{
    background:transparent;border:none;color:var(--text);font-size:12.5px;width:100%;
    font-family:inherit;resize:none;outline:none;line-height:1.5;flex:1;min-height:0;
    cursor:text;user-select:text;-webkit-user-select:text;
  }
  .node-body input::placeholder, .node-body textarea::placeholder{color:var(--text-faint);}
  .node-body .field-label{color:var(--text-faint);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;flex:0 0 auto;}
  .node-body img{max-width:100%;max-height:100%;border-radius:5px;display:block;margin:auto;object-fit:contain;}
  .node-body .img-drop{
    flex:1;display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--node-border);border-radius:6px;padding:16px 8px;text-align:center;
    color:var(--text-faint);font-size:11px;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease);
  }
  .node-body .img-drop:hover{border-color:var(--accent);color:var(--text-dim);}
  .node-head .n-label.locked{cursor:default;opacity:.9;}

  #portsLayer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:60;}

  .port{
    position:absolute;width:16px;height:16px;border-radius:50%;background:var(--accent);
    border:3px solid var(--bg);cursor:crosshair;opacity:0;pointer-events:auto;
    transition:opacity .16s var(--ease), box-shadow .16s var(--ease);
    transform:scale(var(--inv-scale,1));transform-origin:center center;
  }
  .port.port-visible, .port.active{opacity:1;}
  .port:hover{box-shadow:0 0 0 5px var(--accent-glow);}

  .dropdown{
    position:absolute;top:48px;left:0;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:9px;padding:5px;display:none;flex-direction:column;gap:1px;z-index:20;min-width:190px;
    max-height:340px;overflow-y:scroll;
    box-shadow:0 12px 34px rgba(0,0,0,.45);
    animation:dropdownIn .16s var(--ease);
    scrollbar-width:thin;
    scrollbar-color:var(--node-border-hover) transparent;
  }
  .dropdown::-webkit-scrollbar{width:9px;}
  .dropdown::-webkit-scrollbar-track{background:transparent;}
  .dropdown::-webkit-scrollbar-thumb{background:var(--node-border-hover);border-radius:5px;border:2px solid var(--panel);}
  .dropdown::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
  @keyframes dropdownIn{ from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
  .dropdown.open{display:flex;}
  .dropdown button{
    background:none;border:none;color:var(--text-dim);text-align:left;padding:8px 10px;border-radius:6px;
    cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:8px;transition:background .12s var(--ease),color .12s var(--ease);
  }
  .dropdown button svg{width:13px;height:13px;flex-shrink:0;}
  .dropdown button:hover{background:var(--panel-2);color:var(--text);}
  .dropdown .dd-sep{height:1px;background:var(--border);margin:4px 2px;flex-shrink:0;}
  .dropdown .dd-heading{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 2px;font-weight:600;}
  .social-dot{width:14px;height:14px;border-radius:5px;flex-shrink:0;}

  .social-badge{
    width:16px;height:16px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    padding:2px;
  }
  .social-badge img{width:100%;height:100%;object-fit:contain;display:block;}
  .node.node-social{border-left:3px solid var(--sc, var(--accent));}

  .resize-handle{
    position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;
    opacity:0;transition:opacity .16s var(--ease);z-index:5;
  }
  .node:hover .resize-handle,.node.selected .resize-handle{opacity:.9;}
  .resize-handle svg{width:100%;height:100%;color:var(--text-faint);}
  .resize-handle:hover svg{color:var(--accent);}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" title="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <button class="icon-btn" title="Boards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
  <span class="title">Draft</span>
  <button class="btn btn-accent" id="saveBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Save
  </button>
  <div class="spacer"></div>
  <input class="search" placeholder="Rechercher">
  <button class="btn btn-accent">Board</button>
</div>

<div class="layout">
  <div class="sidebar">
    <button class="newboard-btn" id="newBoardBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      New board
    </button>
    <div class="empty-hint" id="boardsHint">No saved boards yet.<br>Build one and hit Save.</div>
    <div id="boardsList" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="toolbar">
      <div style="position:relative;">
        <button class="btn-dark" id="addNodeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add node
        </button>
        <div class="dropdown" id="addDropdown">
          <button data-type="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Note</button>
          <button data-type="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="7" y1="12" x2="12" y2="12"/></svg>Champ libre</button>
          <button data-type="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Image</button>
          <div class="dd-sep"></div>
          <div class="dd-heading">Réseaux sociaux</div>
          <button data-type="social" data-platform="instagram"><span class="social-badge" style="background:#E1306C"><img src="https://cdn.simpleicons.org/instagram/ffffff" alt=""></span>Instagram</button>
          <button data-type="social" data-platform="tiktok"><span class="social-badge" style="background:#000000"><img src="https://cdn.simpleicons.org/tiktok/ffffff" alt=""></span>TikTok</button>
          <button data-type="social" data-platform="discord"><span class="social-badge" style="background:#5865F2"><img src="https://cdn.simpleicons.org/discord/ffffff" alt=""></span>Discord</button>
          <button data-type="social" data-platform="telegram"><span class="social-badge" style="background:#26A5E4"><img src="https://cdn.simpleicons.org/telegram/ffffff" alt=""></span>Telegram</button>
          <button data-type="social" data-platform="whatsapp"><span class="social-badge" style="background:#25D366"><img src="https://cdn.simpleicons.org/whatsapp/ffffff" alt=""></span>WhatsApp</button>
          <button data-type="social" data-platform="x"><span class="social-badge" style="background:#000000"><img src="https://cdn.simpleicons.org/x/ffffff" alt=""></span>X (Twitter)</button>
          <button data-type="social" data-platform="youtube"><span class="social-badge" style="background:#FF0000"><img src="https://cdn.simpleicons.org/youtube/ffffff" alt=""></span>YouTube</button>
          <button data-type="social" data-platform="facebook"><span class="social-badge" style="background:#1877F2"><img src="https://cdn.simpleicons.org/facebook/ffffff" alt=""></span>Facebook</button>
          <button data-type="social" data-platform="snapchat"><span class="social-badge" style="background:#FFFC00"><img src="https://cdn.simpleicons.org/snapchat/000000" alt=""></span>Snapchat</button>
          <button data-type="social" data-platform="linkedin"><span class="social-badge" style="background:#0A66C2"><img src="https://cdn.simpleicons.org/linkedin/ffffff" alt=""></span>LinkedIn</button>
          <button data-type="social" data-platform="twitch"><span class="social-badge" style="background:#9146FF"><img src="https://cdn.simpleicons.org/twitch/ffffff" alt=""></span>Twitch</button>
          <button data-type="social" data-platform="pinterest"><span class="social-badge" style="background:#E60023"><img src="https://cdn.simpleicons.org/pinterest/ffffff" alt=""></span>Pinterest</button>
        </div>
      </div>
      <div class="divider"></div>
      <button class="btn-dark" id="fullscreenBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="btn-dark" id="deleteBtn" title="Supprimer (nœud ou ligne sélectionné)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>

    <div id="stage">
      <svg id="lines"></svg>
      <div id="portsLayer"></div>
    </div>

    <div class="zoom-controls">
      <button id="zoomIn" title="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" title="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
      <button id="zoomFit" title="Ajuster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    </div>

    <div class="minimap" id="minimap"></div>
  </div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const svg = document.getElementById('lines');
  const canvasWrap = document.getElementById('canvasWrap');
  const minimap = document.getElementById('minimap');

  let nodes = [];
  let connections = [];
  let nodeId = 0;
  let scale = 1;
  let panX = -1500, panY = -1500;
  let selectedNode = null;
  let selectedConnIdx = null;
  let tempPathEl = null;

  function clientToStage(clientX, clientY){
    const rect = canvasWrap.getBoundingClientRect();
    return {
      x: (clientX - rect.left - panX) / scale,
      y: (clientY - rect.top - panY) / scale
    };
  }

  function applyTransform(){
    stage.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
    stage.style.setProperty('--inv-scale', 1/scale);
    updateMinimap();
  }

  function positionPorts(el){ /* no-op: centering handled purely in CSS now */ }

  let panning = false, panStart = {x:0,y:0}, panOrigin={x:0,y:0};
  let panRaf = false, pendingPanEvent = null;
  canvasWrap.addEventListener('mousedown', (e)=>{
    if(e.target === canvasWrap || e.target === stage || e.target === svg){
      panning = true;
      canvasWrap.style.cursor = 'grabbing';
      panStart = {x:e.clientX, y:e.clientY};
      panOrigin = {x:panX, y:panY};
      selectNode(null);
    }
  });
  window.addEventListener('mousemove',(e)=>{
    if(!panning) return;
    pendingPanEvent = e;
    if(panRaf) return;
    panRaf = true;
    requestAnimationFrame(()=>{
      panRaf = false;
      if(!pendingPanEvent) return;
      panX = panOrigin.x + (pendingPanEvent.clientX - panStart.x);
      panY = panOrigin.y + (pendingPanEvent.clientY - panStart.y);
      applyTransform();
    });
  });
  window.addEventListener('mouseup',()=>{panning=false; canvasWrap.style.cursor='';});

  function zoomAt(clientX, clientY, factor){
    const rect = canvasWrap.getBoundingClientRect();
    const mouseX = clientX - rect.left;
    const mouseY = clientY - rect.top;
    const stageX = (mouseX - panX) / scale;
    const stageY = (mouseY - panY) / scale;
    const newScale = Math.min(2.5, Math.max(0.3, scale * factor));
    panX = mouseX - stageX * newScale;
    panY = mouseY - stageY * newScale;
    scale = newScale;
    applyTransform();
  }

  function animatedZoomAt(clientX, clientY, targetFactor){
    const steps = 10;
    let i = 0;
    const perStep = Math.pow(targetFactor, 1/steps);
    function step(){
      i++;
      zoomAt(clientX, clientY, perStep);
      if(i < steps) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  canvasWrap.addEventListener('wheel',(e)=>{
    if(e.target.closest && e.target.closest('.dropdown')) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.08 : 0.92;
    zoomAt(e.clientX, e.clientY, delta);
  },{passive:false});

  document.getElementById('zoomIn').onclick = ()=>{
    const r = canvasWrap.getBoundingClientRect();
    animatedZoomAt(r.left + r.width/2, r.top + r.height/2, 1.3);
  };
  document.getElementById('zoomOut').onclick = ()=>{
    const r = canvasWrap.getBoundingClientRect();
    animatedZoomAt(r.left + r.width/2, r.top + r.height/2, 0.72);
  };
  document.getElementById('zoomFit').onclick = ()=>{
    const steps = 12;
    const startScale = scale, startX = panX, startY = panY;
    const endScale = 1, endX = -1500, endY = -1500;
    let i = 0;
    function step(){
      i++;
      const t = i/steps;
      const ease = 1 - Math.pow(1-t, 3);
      scale = startScale + (endScale-startScale)*ease;
      panX = startX + (endX-startX)*ease;
      panY = startY + (endY-startY)*ease;
      applyTransform();
      if(i < steps) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  };

  const ICONS = {
    note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    field: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="7" y1="12" x2="12" y2="12"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
  };

  const SOCIALS = {
    instagram: {label:'Instagram', color:'#E1306C', slug:'instagram'},
    tiktok:    {label:'TikTok',    color:'#000000', slug:'tiktok'},
    discord:   {label:'Discord',   color:'#5865F2', slug:'discord'},
    telegram:  {label:'Telegram',  color:'#26A5E4', slug:'telegram'},
    whatsapp:  {label:'WhatsApp',  color:'#25D366', slug:'whatsapp'},
    x:         {label:'X (Twitter)', color:'#000000', slug:'x'},
    youtube:   {label:'YouTube',   color:'#FF0000', slug:'youtube'},
    facebook:  {label:'Facebook',  color:'#1877F2', slug:'facebook'},
    snapchat:  {label:'Snapchat',  color:'#FFFC00', slug:'snapchat', dark:true},
    linkedin:  {label:'LinkedIn',  color:'#0A66C2', slug:'linkedin'},
    twitch:    {label:'Twitch',    color:'#9146FF', slug:'twitch'},
    pinterest: {label:'Pinterest', color:'#E60023', slug:'pinterest'}
  };

  function createNode(type, x, y, opts){
    opts = opts || {};
    nodeId++;
    const id = 'n'+nodeId;
    const el = document.createElement('div');
    el.className = 'node';
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.dataset.id = id;

    let bodyHTML = '';
    if(type==='note'){
      bodyHTML = '<textarea rows="2" placeholder="Ecrire une note...">' + (opts.text||'') + '</textarea>';
    } else if(type==='field'){
      bodyHTML = '<div class="field-label">Valeur</div><input value="' + (opts.value||'') + '" placeholder="...">';
    } else if(type==='image'){
      bodyHTML = '<div class="img-drop" data-role="dropzone">Glisser une image ou cliquer</div><input type="file" accept="image/*" style="display:none" data-role="filepick">';
    } else if(type==='social'){
      bodyHTML = '<div class="field-label">Identifiant</div><input value="' + (opts.value||'') + '" placeholder="@pseudo">';
    }

    const social = type==='social' ? (SOCIALS[opts.platform] || {label:'Réseau', color:'#888', slug:'link'}) : null;
    const defaultLabel = type==='note' ? 'Note' : (type==='field' ? 'Champ' : (type==='image' ? 'Image' : (social ? social.label : 'Nœud')));
    const iconColor = social ? (social.dark ? '000000' : 'ffffff') : null;
    const headIcon = social
      ? '<span class="social-badge" style="background:'+social.color+'"><img src="https://cdn.simpleicons.org/'+social.slug+'/'+iconColor+'" alt="'+social.label+'"></span>'
      : ICONS[type];

    el.innerHTML =
      '<div class="node-head">' + headIcon +
      '<input class="n-label" value="' + (opts.label || defaultLabel) + '" readonly tabindex="-1"></div>' +
      '<div class="node-body">' + bodyHTML + '</div>' +
      '<div class="resize-handle" title="Redimensionner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v6h-6M21 21 13 13"/><path d="M15 21H9m0 0v-6"/></svg></div>';

    if(social){
      el.classList.add('node-social');
      el.style.setProperty('--sc', social.color);
    }

    stage.appendChild(el);
    nodes.push({id:id, el:el, type:type, platform: opts.platform || null});
    el.classList.add('entering');
    setTimeout(()=>el.classList.remove('entering'), 300);

    makeDraggable(el);
    makeResizable(el);
    createPortsForNode(el);
    el.addEventListener('mousedown', (e)=>{ e.stopPropagation(); selectNode(el); });

    // Correctif : un clic sur n'importe quel champ texte du nœud sélectionne
    // tout son contenu, pour pouvoir taper directement par-dessus (renommer
    // le nœud, changer le pseudo, etc. en un seul clic).
    el.querySelectorAll('.node-body input, .node-body textarea').forEach(function(field){
      field.addEventListener('mousedown', function(e){ e.stopPropagation(); });
      field.addEventListener('focus', function(){
        const self = this;
        requestAnimationFrame(function(){ self.select(); });
      });
    });

    if(type==='image'){
      const dz = el.querySelector('[data-role="dropzone"]');
      const fp = el.querySelector('[data-role="filepick"]');
      dz.addEventListener('click',(e)=>{e.stopPropagation(); fp.click();});
      fp.addEventListener('change',()=>{
        const file = fp.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{
          dz.outerHTML = '<img src="' + reader.result + '">';
          updateConnections();
        };
        reader.readAsDataURL(file);
      });
    }

    return el;
  }

  function selectNode(el){
    nodes.forEach(function(n){ n.el.classList.remove('selected'); });
    selectedNode = el;
    if(el) el.classList.add('selected');
    if(selectedConnIdx !== null){
      selectedConnIdx = null;
      updateConnections();
    }
  }

  function selectConnection(idx){
    nodes.forEach(function(n){ n.el.classList.remove('selected'); });
    selectedNode = null;
    selectedConnIdx = idx;
    updateConnections();
  }

  function makeDraggable(el){
    let dragging=false, start={x:0,y:0}, orig={x:0,y:0};
    let raf=false, pendingEvt=null;
    el.addEventListener('mousedown',(e)=>{
      if(e.target.classList.contains('port')) return;
      if(e.target.tagName==='TEXTAREA' || e.target.tagName==='INPUT') return;
      dragging = true;
      el.classList.add('dragging');
      start = {x:e.clientX, y:e.clientY};
      orig = {x:parseFloat(el.style.left), y:parseFloat(el.style.top)};
      e.stopPropagation();
    });
    window.addEventListener('mousemove',(e)=>{
      if(!dragging) return;
      pendingEvt = e;
      if(raf) return;
      raf = true;
      requestAnimationFrame(()=>{
        raf = false;
        if(!pendingEvt) return;
        const dx = (pendingEvt.clientX-start.x)/scale;
        const dy = (pendingEvt.clientY-start.y)/scale;
        el.style.left = (orig.x+dx)+'px';
        el.style.top = (orig.y+dy)+'px';
        updateNodePorts(el);
        updateConnections();
      });
    });
    window.addEventListener('mouseup',()=>{
      if(dragging){ dragging=false; el.classList.remove('dragging'); }
    });
  }

  function makeResizable(el){
    const handle = el.querySelector('.resize-handle');
    if(!handle) return;
    let resizing=false, start={x:0,y:0}, orig={w:0,h:0};
    let raf=false, pendingEvt=null;
    handle.addEventListener('mousedown',(e)=>{
      e.stopPropagation();
      resizing = true;
      start = {x:e.clientX, y:e.clientY};
      orig = {w: el.offsetWidth, h: el.offsetHeight};
    });
    window.addEventListener('mousemove',(e)=>{
      if(!resizing) return;
      pendingEvt = e;
      if(raf) return;
      raf = true;
      requestAnimationFrame(()=>{
        raf = false;
        if(!pendingEvt) return;
        const dx = (pendingEvt.clientX-start.x)/scale;
        const dy = (pendingEvt.clientY-start.y)/scale;
        const newW = Math.max(160, orig.w+dx);
        const newH = Math.max(70, orig.h+dy);
        el.style.width = newW+'px';
        el.style.height = newH+'px';
        updateNodePorts(el);
        updateConnections();
      });
    });
    window.addEventListener('mouseup',()=>{ resizing=false; });
  }

  let connecting = null;

  function createPortsForNode(el){
    const ports = {};
    ['left','right','top','bottom'].forEach(function(side){
      const p = document.createElement('div');
      p.className = 'port port-'+side;
      portsLayer.appendChild(p);
      ports[side] = p;
      p.addEventListener('mousedown',(e)=>{
        e.stopPropagation();
        connecting = {fromEl: el, fromSide: side};
        tempPathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
        tempPathEl.setAttribute('class','conn-path conn-temp');
        svg.appendChild(tempPathEl);
        updateTempPath(e.clientX, e.clientY);
      });
      p.addEventListener('mouseup',(e)=>{
        e.stopPropagation();
        if(connecting && connecting.fromEl !== el){
          connections.push({from: connecting.fromEl.dataset.id, fromSide: connecting.fromSide, to: el.dataset.id, toSide: side});
          updateConnections();
        }
        endConnecting();
      });
    });
    el._ports = ports;
    el.addEventListener('mouseenter', function(){
      Object.values(ports).forEach(function(p){ p.classList.add('port-visible'); });
    });
    el.addEventListener('mouseleave', function(){
      Object.values(ports).forEach(function(p){ p.classList.remove('port-visible'); });
    });
    updateNodePorts(el);
  }

  function updateNodePorts(el){
    const ports = el._ports;
    if(!ports) return;
    ['left','right','top','bottom'].forEach(function(side){
      const pos = portPos(el, side);
      ports[side].style.left = (pos.x-8)+'px';
      ports[side].style.top = (pos.y-8)+'px';
    });
  }

  function removePortsForNode(el){
    if(!el._ports) return;
    Object.values(el._ports).forEach(function(p){ p.remove(); });
    el._ports = null;
  }

  function updateTempPath(clientX, clientY){
    if(!connecting || !tempPathEl) return;
    const p1 = portPos(connecting.fromEl, connecting.fromSide);
    const p2 = clientToStage(clientX, clientY);
    const dist = Math.max(40, (Math.abs(p2.x-p1.x)+Math.abs(p2.y-p1.y))*0.4);
    const o1 = controlOffset(connecting.fromSide, dist);
    const c1x = p1.x+o1.x, c1y = p1.y+o1.y;
    const d = 'M ' + p1.x + ' ' + p1.y + ' C ' + c1x + ' ' + c1y + ', ' + p2.x + ' ' + p2.y + ', ' + p2.x + ' ' + p2.y;
    tempPathEl.setAttribute('d', d);
  }

  function endConnecting(){
    if(tempPathEl){ tempPathEl.remove(); tempPathEl = null; }
    connecting = null;
  }

  window.addEventListener('mousemove', (e)=>{
    if(connecting) updateTempPath(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', ()=>{
    if(connecting) endConnecting();
  });

  function portPos(el, side){
    const x = parseFloat(el.style.left);
    const y = parseFloat(el.style.top);
    const w = el.offsetWidth, h = el.offsetHeight;
    if(side==='left') return {x:x, y:y+h/2};
    if(side==='right') return {x:x+w, y:y+h/2};
    if(side==='top') return {x:x+w/2, y:y};
    return {x:x+w/2, y:y+h};
  }

  function controlOffset(side, dist){
    if(side==='left') return {x:-dist, y:0};
    if(side==='right') return {x:dist, y:0};
    if(side==='top') return {x:0, y:-dist};
    return {x:0, y:dist};
  }

  function updateConnections(){
    nodes.forEach(function(n){ updateNodePorts(n.el); });
    svg.innerHTML = '';
    connections.forEach(function(c, idx){
      const fromEl = stage.querySelector('[data-id="'+c.from+'"]');
      const toEl = stage.querySelector('[data-id="'+c.to+'"]');
      if(!fromEl||!toEl) return;
      const fromSide = c.fromSide || 'right';
      const toSide = c.toSide || 'left';
      const p1 = portPos(fromEl, fromSide);
      const p2 = portPos(toEl, toSide);
      const dist = Math.max(40, (Math.abs(p2.x-p1.x)+Math.abs(p2.y-p1.y))*0.4);
      const o1 = controlOffset(fromSide, dist);
      const o2 = controlOffset(toSide, dist);
      const c1x = p1.x+o1.x, c1y = p1.y+o1.y;
      const c2x = p2.x+o2.x, c2y = p2.y+o2.y;
      const d = 'M ' + p1.x + ' ' + p1.y + ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + p2.x + ' ' + p2.y;

      // Zone de clic invisible, plus large, pour attraper facilement la ligne
      const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('d', d);
      hit.setAttribute('class','conn-hit');
      hit.addEventListener('click', function(e){ e.stopPropagation(); selectConnection(idx); });
      hit.addEventListener('dblclick', function(e){ e.stopPropagation(); deleteConnection(idx); });
      svg.appendChild(hit);

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('class','conn-path' + (idx===selectedConnIdx ? ' selected' : ''));
      path.addEventListener('click', function(e){ e.stopPropagation(); selectConnection(idx); });
      path.addEventListener('dblclick', function(e){ e.stopPropagation(); deleteConnection(idx); });
      svg.appendChild(path);

      [p1,p2].forEach(function(p){
        const c1 = document.createElementNS('http://www.w3.org/2000/svg','circle');
        c1.setAttribute('cx',p.x); c1.setAttribute('cy',p.y); c1.setAttribute('r',3);
        c1.setAttribute('class','conn-dot');
        svg.appendChild(c1);
      });
    });
    updateMinimap();
  }

  function deleteConnection(idx){
    connections.splice(idx,1);
    selectedConnIdx = null;
    updateConnections();
  }

  function updateMinimap(){
    minimap.innerHTML='';
    const sx = 190/6000, sy = 140/4000;
    nodes.forEach(function(n){
      const x = parseFloat(n.el.style.left)*sx;
      const y = parseFloat(n.el.style.top)*sy;
      const d = document.createElement('div');
      d.className='minimap-dot';
      d.style.left = x+'px'; d.style.top=y+'px';
      d.style.width='9px'; d.style.height='6px';
      minimap.appendChild(d);
    });
  }

  const addBtn = document.getElementById('addNodeBtn');
  const dropdown = document.getElementById('addDropdown');
  addBtn.onclick = (e)=>{e.stopPropagation(); dropdown.classList.toggle('open');};
  document.body.addEventListener('click',()=>dropdown.classList.remove('open'));
  dropdown.querySelectorAll('button').forEach(function(b){
    b.onclick = (e)=>{
      e.stopPropagation();
      const opts = {};
      if(b.dataset.type === 'social') opts.platform = b.dataset.platform;
      createNode(b.dataset.type, 1600+Math.random()*80, 1600+Math.random()*80, opts);
      dropdown.classList.remove('open');
    };
  });

  document.getElementById('deleteBtn').onclick = ()=>{
    if(selectedConnIdx !== null){
      deleteConnection(selectedConnIdx);
      return;
    }
    if(selectedNode){
      const id = selectedNode.dataset.id;
      connections = connections.filter(function(c){ return c.from!==id && c.to!==id; });
      nodes = nodes.filter(function(n){ return n.id!==id; });
      removePortsForNode(selectedNode);
      selectedNode.remove();
      selectedNode = null;
      updateConnections();
    }
  };

  // Suppression au clavier (Suppr / Retour arrière), sauf si on tape dans un champ
  window.addEventListener('keydown', function(e){
    if(e.key === 'Delete' || e.key === 'Backspace'){
      const active = document.activeElement;
      if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
      if(selectedConnIdx !== null || selectedNode){
        e.preventDefault();
        document.getElementById('deleteBtn').click();
      }
    }
  });

  document.getElementById('fullscreenBtn').onclick = ()=>{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); }
    else{ document.exitFullscreen(); }
  };

  const boardsList = document.getElementById('boardsList');
  const boardsHint = document.getElementById('boardsHint');
  let savedBoards = [];

  function serialize(){
    return {
      nodes: nodes.map(function(n){
        return {
          id:n.id, type:n.type, platform:n.platform || null,
          left:n.el.style.left, top:n.el.style.top,
          width:n.el.style.width, height:n.el.style.height,
          label: n.el.querySelector('.n-label').value,
          html: n.el.querySelector('.node-body').innerHTML
        };
      }),
      connections: connections
    };
  }

  document.getElementById('saveBtn').onclick = ()=>{
    const name = prompt('Nom du board :', 'Board '+(savedBoards.length+1));
    if(!name) return;
    savedBoards.push({name:name, data: serialize()});
    renderBoardsList();
  };

  function renderBoardsList(){
    boardsHint.style.display = savedBoards.length ? 'none' : 'block';
    boardsList.innerHTML = '';
    savedBoards.forEach(function(b){
      const item = document.createElement('button');
      item.className='board-item';
      item.innerHTML = '<span class="b-dot"></span>' + b.name;
      item.onclick = ()=> loadBoard(b.data);
      boardsList.appendChild(item);
    });
  }

  function loadBoard(data){
    nodes.forEach(function(n){ removePortsForNode(n.el); n.el.remove(); });
    nodes = []; connections = [];
    data.nodes.forEach(function(nd){
      const el = createNode(nd.type, parseFloat(nd.left), parseFloat(nd.top), {label:nd.label, platform:nd.platform});
      el.querySelector('.node-body').innerHTML = nd.html;
      el.dataset.id = nd.id;
      if(nd.width) el.style.width = nd.width;
      if(nd.height) el.style.height = nd.height;
    });
    connections = data.connections;
    updateConnections();
  }

  document.getElementById('newBoardBtn').onclick = ()=>{
    nodes.forEach(function(n){ removePortsForNode(n.el); n.el.remove(); });
    nodes = []; connections = [];
    updateConnections();
  };

  applyTransform();
})();
</script>
</body>
</html>
